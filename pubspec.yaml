name: islamic_app
description: "A new Flutter project."


publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash:
  cupertino_icons: ^1.0.8
  flutter_local_notifications:
  timezone:
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7
  get_it:
  audioplayers:
  flutter_timezone:
  hijri_date_time:
  prayer_times_helper:
  hijri:
  intl:
  adhan_dart:
  geolocator:
  adhan:
  flutter_svg:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  android: true
  ios: true

  color: "#ffffff"
#  background_image: "assets/images/Splash Screen.png"
#  background_image: android/app/src/main/res/drawable/splash_gradient.xml

  image: "assets/icons/logo.png"

  android_gravity: center
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/surah/
    - assets/azkar/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/quran_search.json

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
          weight: 900

    - family: QuranFont
      fonts:
        - asset: assets/fonts/me_quran.ttf
